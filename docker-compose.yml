services:
  db:
    image: postgres:16-alpine
    container_name: tnc-postgres
    networks:
      - tnc-server-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - "5432:5432"
    volumes:
      - tnc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    # build: .
    image: tnc-server:local
    container_name: tnc-server
    networks:
      - tnc-server-net
    ports:
      - "8182:8181"
      - "6408:6407"
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8181}
      CRYPTO_TCP_ADDR: ${CRYPTO_TCP_ADDR:-:6407}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-tnc}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-niima2026}}
      DB_NAME: ${DB_NAME:-tnc}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      SESSION_SECRET: ${SESSION_SECRET}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tnc-pgdata:

networks: 
  tnc-server-net:
     driver: bridge
     ipam:
      config:
        - subnet: 10.90.90.0/24