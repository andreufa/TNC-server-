{{define "charts.html"}}
{{template "top" .}}

<link rel="stylesheet" href="/static/uplot.min.css">

<h1>Поправки (0x59)</h1>

<div class="card">
  <div class="row">
    <label>Устройство
      <select id="deviceSel">
        {{range .Devices}}<option value="{{.ID}}">{{.ID}}</option>{{end}}
      </select>
    </label>
    <label>Диапазон
      <select id="rangeSel">
        <option value="1">1 час</option>
        <option value="6" selected>6 часов</option>
        <option value="24">24 часа</option>
        <option value="72">3 дня</option>
        <option value="168">7 дней</option>
      </select>
    </label>
    <button id="refreshBtn" class="primary" type="button">Обновить</button>
    <label class="chk"><input type="checkbox" id="autoChk" checked> автообновление (5 с)</label>
    <label class="chk" title="Отклонение от первой точки выбранного диапазона — видна динамика поправок">
      <input type="checkbox" id="deltaChk"> Δ от начала диапазона
    </label>
    <label class="chk" title="Ось X — момент приёма сообщения сервером; без галочки — время из кадра устройства">
      <input type="checkbox" id="rxChk" checked> ось: время приёма
    </label>
    <span id="status" style="color:#666;"></span>
  </div>

  <div id="legend" style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:.85rem;">
    <label class="chk"><input type="checkbox" class="seriesChk" data-idx="0" checked>
      <span style="display:inline-block;width:10px;height:10px;background:#e53e3e;border-radius:2px;"></span> iekf_hw_offset_1</label>
    <label class="chk"><input type="checkbox" class="seriesChk" data-idx="1" checked>
      <span style="display:inline-block;width:10px;height:10px;background:#38a169;border-radius:2px;"></span> iekf_hw_offset_2</label>
    <label class="chk"><input type="checkbox" class="seriesChk" data-idx="2" checked>
      <span style="display:inline-block;width:10px;height:10px;background:#3182ce;border-radius:2px;"></span> iekf_hw_offset_3</label>
  </div>

  <div id="chart" style="width:100%;height:420px;margin-top:12px;"></div>
  <div id="stats" style="margin-top:8px;color:#666;font-size:.85rem;"></div>
</div>

{{if not .Devices}}
<p>Нет зарегистрированных устройств — поправки недоступны.</p>
{{end}}

<script src="/static/uplot.iife.min.js"></script>
<script>
(function () {
  var COLORS = ['#e53e3e', '#38a169', '#3182ce'];
  var NAMES = ['iekf_hw_offset_1', 'iekf_hw_offset_2', 'iekf_hw_offset_3'];
  var plot = null;
  var timer = null;
  // Текущие данные рендера — тултип курсора читает их, чтобы не замыкать
  // устаревший набор точек между автообновлениями.
  var cur = { t: [], o: [[], [], []], points: [] };

  var deviceSel = document.getElementById('deviceSel');
  var rangeSel = document.getElementById('rangeSel');
  var autoChk = document.getElementById('autoChk');
  var deltaChk = document.getElementById('deltaChk');
  var rxChk = document.getElementById('rxChk');
  var refreshBtn = document.getElementById('refreshBtn');
  var statusEl = document.getElementById('status');
  var statsEl = document.getElementById('stats');
  var chartEl = document.getElementById('chart');
  var legendChks = document.querySelectorAll('.seriesChk');

  if (!deviceSel || deviceSel.options.length === 0) return; // нет устройств

  // В течение сессии помним выбранное устройство: переключение на другие
  // вкладки и обратно не сбрасывает выбор (sessionStorage живёт на вкладку).
  var savedDevice = sessionStorage.getItem('chartsDevice');
  var qsDevice = new URLSearchParams(location.search).get('device');
  var selected = savedDevice || qsDevice;
  if (selected) {
    deviceSel.value = selected;
    sessionStorage.setItem('chartsDevice', selected);
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function fmt(v) {
    if (v === null || v === undefined) return '—';
    return Number(v).toFixed(6);
  }

  function firstValid(arr) {
    for (var i = 0; i < arr.length; i++) {
      if (arr[i] !== null && arr[i] !== undefined) return arr[i];
    }
    return null;
  }

  // Всплывающая подсказка при наведении: точное время, момент приёма,
  // значения слотов (невалидные помечаются).
  function cursorTooltip(u, seriesIdx, idx0, idx1) {
    if (idx0 === null || idx0 === undefined) return null;
    var p = cur.points[idx0];
    if (!p) return null;
    var d = new Date(cur.t[idx0] * 1000);
    var rx = new Date(p.received_at);
    var html = '<b>' + d.toLocaleString('ru-RU') + '</b>';
    html += '<br>получено: ' + rx.toLocaleTimeString('ru-RU') +
      ' · ' + Math.max(0, Math.round((Date.now() - p.received_at) / 1000)) + ' с назад';
    for (var s = 0; s < 3; s++) {
      if (!legendChks[s].checked) continue;
      var v = cur.o[s][idx0];
      var valid = (p.validity & (1 << s)) !== 0;
      html += '<br><span style="color:' + COLORS[s] + '">' + NAMES[s] + '</span>: ' +
        (valid ? fmt(v) + ' м' : '— (invalid)');
    }
    return html;
  }

  // subtractBase вычитает базовую линию (первое валидное значение) из ряда:
  // так на графике видна динамика поправок, а не их абсолютная база (~4e6 м).
  function subtractBase(arr) {
    var base = firstValid(arr);
    if (base === null) return arr;
    return arr.map(function (v) { return v === null || v === undefined ? null : v - base; });
  }

  function render(points) {
    if (typeof uPlot === 'undefined') {
      chartEl.textContent = 'Библиотека графиков не загрузилась (uplot.iife.min.js)';
      statsEl.textContent = '';
      plot = null;
      return;
    }

    var useRx = rxChk.checked;
    var t = [], raw = [[], [], []];
    for (var i = 0; i < points.length; i++) {
      // uPlot ожидает Unix-секунды; в JSON время — миллисекунды.
      t.push((useRx ? points[i].received_at : points[i].utc) / 1000);
      raw[0].push(points[i].iekf_hw_offset_1);
      raw[1].push(points[i].iekf_hw_offset_2);
      raw[2].push(points[i].iekf_hw_offset_3);
    }

    if (t.length === 0) {
      if (plot) {
        plot.destroy();
        plot = null;
      }
      chartEl.textContent = 'Нет данных за выбранный период';
      statsEl.textContent = '';
      return;
    }

    var delta = deltaChk.checked;
    var o1 = raw[0], o2 = raw[1], o3 = raw[2];
    if (delta) {
      o1 = subtractBase(o1);
      o2 = subtractBase(o2);
      o3 = subtractBase(o3);
    }
    cur.t = t;
    cur.o = [o1, o2, o3];
    cur.points = points;

    if (plot) {
      // График уже создан: только обновляем данные, не трогая его DOM
      // (пересоздание контейнера скрывает canvas).
      plot.setData([t, o1, o2, o3]);
    } else {
      chartEl.textContent = '';
      // uPlot 1.6 не подбирает ширину из контейнера: без явного width
      // размер становится NaN и canvas невидим. Берём ширину контейнера.
      var w = chartEl.clientWidth;
      if (!w || w < 10) w = 800; // страховка на случай нулевой ширины при инициализации
      // Подписи делений: время суток для коротких диапазонов, дата+время — для длинных.
      var tickVals = function (u, splits) {
        var span = u.scales.x.max - u.scales.x.min;
        return splits.map(function (v) {
          var d = new Date(v * 1000);
          var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
          return span > 86400
            ? pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + ' ' + hm
            : hm + ':' + pad2(d.getSeconds());
        });
      };
      plot = new uPlot({
        width: w,
        height: 420,
        scales: { x: { time: true } },
        series: [
          {},
          { label: NAMES[0], stroke: COLORS[0], width: 1.4 },
          { label: NAMES[1], stroke: COLORS[1], width: 1.4 },
          { label: NAMES[2], stroke: COLORS[2], width: 1.4 }
        ],
        axes: [
          { label: useRx ? 'время приёма (местное)' : 'время устройства', size: 42, values: tickVals },
          { label: delta ? 'Δ, метры' : 'метры', size: 70 }
        ],
        legend: { show: false }, // своя легенда над графиком (не сдвигает canvas)
        cursor: {
          drag: { x: true, y: false },
          points: { show: cursorTooltip }
        }
      }, [t, o1, o2, o3], chartEl);
      window.addEventListener('resize', function () {
        if (plot) plot.setSize({ width: chartEl.clientWidth, height: 420 });
      });
    }

    // Синхронизируем видимость серий с чекбоксами.
    for (var s = 0; s < 3; s++) {
      plot.setSeries(s + 1, { show: legendChks[s].checked });
    }

    var n = t.length;
    var prefix = delta ? 'Δ' : '';
    var d0 = new Date(t[0] * 1000);
    var d1 = new Date(t[n - 1] * 1000);
    statsEl.textContent =
      'Первая точка: ' + d0.toLocaleString('ru-RU') + ' · Последняя: ' + d1.toLocaleString('ru-RU') +
      ' · Последние значения: ' + prefix + NAMES[0] + '=' + fmt(o1[n - 1]) + ' м · ' + prefix + NAMES[1] + '=' + fmt(o2[n - 1]) + ' м · ' + prefix + NAMES[2] + '=' + fmt(o3[n - 1]) +
      ' м · всего точек: ' + n;
  }

  async function refresh() {
    var device = deviceSel.value;
    var hours = rangeSel.value;
    statusEl.textContent = 'загрузка…';
    try {
      var resp = await fetch('/api/measurements?device=' + encodeURIComponent(device) + '&hours=' + hours);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();
      render(data.points);
      statusEl.textContent = 'обновлено: ' + new Date().toLocaleTimeString('ru-RU');
    } catch (e) {
      statusEl.textContent = 'ошибка: ' + (e && e.message ? e.message : e);
    }
  }

  refreshBtn.addEventListener('click', refresh);
  deviceSel.addEventListener('change', function () {
    sessionStorage.setItem('chartsDevice', deviceSel.value);
    refresh();
  });
  rangeSel.addEventListener('change', refresh);

  // Переключение режима Δ: пересоздаём график (меняется подпись оси).
  deltaChk.addEventListener('change', function () {
    if (plot) {
      plot.destroy();
      plot = null;
    }
    refresh();
  });
  // Переключение оси X (время приёма / время устройства): пересоздаём график,
  // так как меняются данные оси и её подпись.
  rxChk.addEventListener('change', function () {
    if (plot) {
      plot.destroy();
      plot = null;
    }
    refresh();
  });

  for (var i = 0; i < legendChks.length; i++) {
    (function (idx) {
      legendChks[idx].addEventListener('change', function () {
        if (plot) plot.setSeries(idx + 1, { show: this.checked });
      });
    })(i);
  }

  function applyAuto() {
    if (autoChk.checked) {
      if (!timer) timer = setInterval(refresh, 5000);
    } else {
      clearInterval(timer);
      timer = null;
    }
  }
  autoChk.addEventListener('change', applyAuto);
  applyAuto();
  refresh();
})();
</script>
<style>main { max-width: 1200px; }</style>

{{template "bottom" .}}
{{end}}
