{{define "logs.html"}}
{{template "top" .}}
<h1>Системные логи</h1>

<div class="card">
    <div style="margin-bottom: 10px;">
        <button onclick="clearLogs()">Очистить</button>
        <button onclick="toggleAutoScroll()">Автоскролл: включен</button>
        <span id="logCount" style="margin-left: 10px; color: #666;">Подключено: 0 логов</span>
    </div>
    <div id="logContainer" style="
        background: #1a202c;
        color: #e2e8f0;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        padding: 16px;
        height: 500px;
        overflow-y: auto;
        border-radius: 6px;
        white-space: pre-wrap;
        word-wrap: break-word;
    ">
        <div style="color: #68d391;">=== Системные логи (в реальном времени) ===</div>
        <div style="color: #718096;">Ожидание подключения к серверу логов...</div>
    </div>
</div>

<style>
    .log-entry {
        padding: 2px 0;
        border-bottom: 1px solid #2d3748;
    }
    .log-time {
        color: #718096;
        margin-right: 10px;
    }
    .log-type {
        display: inline-block;
        padding: 0 8px;
        border-radius: 3px;
        font-weight: bold;
        margin-right: 10px;
        font-size: 11px;
    }
    .log-type-connect { background: #2f855a; color: #fff; }
    .log-type-disconnect { background: #9b2c2c; color: #fff; }
    .log-type-auth { background: #2b6cb0; color: #fff; }
    .log-type-message { background: #553c9a; color: #fff; }
    .log-type-handshake { background: #744210; color: #fff; }
    .log-device { color: #f6ad55; }
    .log-message { color: #e2e8f0; }
    .log-json { color: #68d391; }
</style>

<script>
    let ws = null;
    let logCount = 0;
    let autoScroll = true;
    const container = document.getElementById('logContainer');
    const logCountSpan = document.getElementById('logCount');

    function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/logs/ws`;
        
        ws = new WebSocket(wsUrl);
        
        ws.onopen = function() {
            addLog('system', 'Система', 'Подключение к серверу логов установлено');
        };
        
        ws.onmessage = function(event) {
            try {
                const log = JSON.parse(event.data);
                addLog(log.type, log.device_id, log.message, log.timestamp);
            } catch (e) {
                addLog('system', 'Ошибка', 'Не удалось распарсить лог: ' + event.data);
            }
        };
        
        ws.onclose = function() {
            addLog('system', 'Система', 'Соединение с сервером логов потеряно. Переподключение через 3 секунды...');
            setTimeout(connectWebSocket, 3000);
        };
        
        ws.onerror = function(error) {
            addLog('system', 'Ошибка', 'Ошибка WebSocket: ' + error);
        };
    }

    function addLog(type, deviceId, message, timestamp) {
        const time = timestamp || new Date().toLocaleTimeString('ru-RU');
        
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        
        const typeClass = {
            'connect': 'log-type-connect',
            'disconnect': 'log-type-disconnect', 
            'auth': 'log-type-auth',
            'message': 'log-type-message',
            'handshake': 'log-type-handshake',
            'system': 'log-type-auth'
        }[type] || 'log-type-auth';
        
        let typeLabel = type.charAt(0).toUpperCase() + type.slice(1);
        if (type === 'message') {
            typeLabel = 'MSG';
        }
        
        let deviceDisplay = deviceId || '—';
        if (deviceDisplay.length > 20) {
            deviceDisplay = deviceDisplay.substring(0, 17) + '...';
        }
        
        entry.innerHTML = `
            <span class="log-time">[${time}]</span>
            <span class="log-type ${typeClass}">${typeLabel}</span>
            <span class="log-device">${deviceDisplay}</span>
            <span class="log-message">${escapeHtml(message)}</span>
        `;
        
        container.appendChild(entry);
        logCount++;
        logCountSpan.textContent = `Логов: ${logCount}`;
        
        if (autoScroll) {
            container.scrollTop = container.scrollHeight;
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function clearLogs() {
        container.innerHTML = '';
        logCount = 0;
        logCountSpan.textContent = 'Логов: 0';
        addLog('system', 'Система', 'Логи очищены');
    }

    function toggleAutoScroll() {
        autoScroll = !autoScroll;
        const btn = document.querySelector('button[onclick="toggleAutoScroll()"]');
        btn.textContent = `Автоскролл: ${autoScroll ? 'включен' : 'выключен'}`;
    }

    // Подключаемся при загрузке страницы
    window.onload = function() {
        connectWebSocket();
        
        // Добавляем обработчик для обновления счетчика при скролле
        container.addEventListener('scroll', function() {
            const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;
            if (isAtBottom && !autoScroll) {
                autoScroll = true;
                const btn = document.querySelector('button[onclick="toggleAutoScroll()"]');
                btn.textContent = 'Автоскролл: включен';
            }
        });
    };
</script>
{{template "bottom" .}}
{{end}}
